<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vote de Pubs</title>

<!--
  ============================================================
  ÉTAPE 1 : Remplace ca-pub-XXXXXXXXXXXXXXXX ci-dessous
  par TON propre ID éditeur AdSense (tu le trouves dans ton
  compte AdSense > Compte > Informations sur le compte).
  ============================================================
-->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
     crossorigin="anonymous"></script>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #111827;
    color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  h1 {
    position: absolute;
    top: 20px;
    font-size: 18px;
    font-weight: 600;
    color: #9ca3af;
  }

  .card {
    width: 100%;
    max-width: 500px;
    background: #1f2937;
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  .ad-slot {
    width: 100%;
    min-height: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #374151;
    border-radius: 10px;
    overflow: hidden;
  }

  .buttons {
    display: flex;
    gap: 20px;
    margin-top: 24px;
    width: 100%;
  }

  button {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 18px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease;
  }

  button:active {
    transform: scale(0.95);
  }

  .like {
    background: #16a34a;
    color: white;
  }

  .dislike {
    background: #dc2626;
    color: white;
  }

  button:disabled {
    background: #4b5563;
    cursor: not-allowed;
    opacity: 0.6;
  }

  .stats {
    margin-top: 16px;
    font-size: 14px;
    color: #9ca3af;
  }

  .stats span {
    font-weight: 700;
    color: #fff;
  }
</style>
</head>
<body>

<h1>Vote de Pubs</h1>

<div class="card">
  <div class="ad-slot" id="ad-container">
    <!--
      ============================================================
      ÉTAPE 2 : Remplace data-ad-slot="XXXXXXXXXX" ci-dessous par
      l'ID d'un vrai bloc d'annonce que tu crées dans AdSense
      (Annonces > Par emplacement > Nouveau bloc d'annonces).
      ============================================================
    -->
    <ins class="adsbygoogle"
         style="display:block; width:100%; min-height:280px;"
         data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
         data-ad-slot="XXXXXXXXXX"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
  </div>

  <div class="buttons">
    <button class="dislike" id="btn-dislike" onclick="vote('dislike')" disabled>👎 J'aime pas</button>
    <button class="like" id="btn-like" onclick="vote('like')" disabled>👍 J'aime</button>
  </div>

  <div class="stats" id="cooldown-msg">Regarde la pub encore <span id="cooldown-timer">10</span>s...</div>

  <div class="stats">
    J'aime : <span id="like-count">0</span> &nbsp;|&nbsp; J'aime pas : <span id="dislike-count">0</span>
  </div>
</div>

<script>
  let likeCount = 0;
  let dislikeCount = 0;
  const COOLDOWN_SECONDS = 10;
  let cooldownInterval = null;

  const btnLike = document.getElementById('btn-like');
  const btnDislike = document.getElementById('btn-dislike');
  const cooldownMsg = document.getElementById('cooldown-msg');
  const cooldownTimer = document.getElementById('cooldown-timer');

  function vote(choice) {
    if (btnLike.disabled) return; // sécurité anti double-clic pendant le cooldown

    if (choice === 'like') {
      likeCount++;
      document.getElementById('like-count').textContent = likeCount;
    } else {
      dislikeCount++;
      document.getElementById('dislike-count').textContent = dislikeCount;
    }
    loadNewAd();
    startCooldown();
  }

  function startCooldown() {
    let secondsLeft = COOLDOWN_SECONDS;
    btnLike.disabled = true;
    btnDislike.disabled = true;
    cooldownMsg.style.display = 'block';
    cooldownTimer.textContent = secondsLeft;

    if (cooldownInterval) clearInterval(cooldownInterval);

    cooldownInterval = setInterval(() => {
      secondsLeft--;
      if (secondsLeft <= 0) {
        clearInterval(cooldownInterval);
        btnLike.disabled = false;
        btnDislike.disabled = false;
        cooldownMsg.style.display = 'none';
      } else {
        cooldownTimer.textContent = secondsLeft;
      }
    }, 1000);
  }

  function loadNewAd() {
    const container = document.getElementById('ad-container');
    container.innerHTML = `
      <ins class="adsbygoogle"
           style="display:block; width:100%; min-height:280px;"
           data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
           data-ad-slot="XXXXXXXXXX"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
    `;
    try {
      (adsbygoogle = window.adsbygoogle || []).push({});
    } catch (e) {
      console.error('Erreur de chargement de la pub :', e);
    }
  }

  // Cooldown initial au chargement de la page (pour la toute première pub)
  startCooldown();
</script>

</body>
</html>
